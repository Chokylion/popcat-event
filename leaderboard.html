<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060f">
<title>Kaizen Pop-Cat — Leaderboard</title>
<link rel="preconnect" href="https://YOUR-PROJECT.supabase.co" crossorigin>
<script>
/* The first get_board is by far the longest pole on this page: measured on
   production it takes 0.7-3.0s (Supabase cold start) and it used to not even
   START until ~650ms, because it waited for the stylesheet, the fonts, both
   script tags and DOMContentLoaded. The request needs none of those -- it is
   pure network -- so it is fired here, from <head>, before anything else is
   even parsed. Nothing is rendered any later; the board simply stops sitting
   empty waiting for a request it could have made half a second earlier.
   Consumed by firstBoard() in sb.js, which also picks the clock skew out of it.

   THIS SCRIPT MUST STAY ABOVE EVERY <link rel="stylesheet">.
   A parser-inserted script cannot execute until all preceding stylesheets have
   loaded, so with style.css above it the RPC was still starting within 3-8ms
   of style.css finishing -- 993/1017/1497/3125ms across four production reps,
   i.e. the whole "fire it early" fix was silently doing nothing. Measured
   after the move: see the table in the commit. Put a <link> above this and the
   regression comes straight back with no visible symptom.

   WHY THE URL AND KEY ARE LITERALS INSTEAD OF CFG.*
   Reading them from config.js put a whole serial round trip in front of the
   request: measured on production, get_board started at 822ms on a good run
   and 2614ms on a slow one, purely waiting for a 1KB script. The anon key is
   public by design (every table is RLS-denied, all access goes through RPCs),
   so it costs nothing to state it here -- but two copies can drift, so the
   check right after config.js loads shouts if they ever do, and qaprod.mjs
   fails the build on any console error. */
var B0U = 'https://YOUR-PROJECT.supabase.co', B0K = 'YOUR-SUPABASE-ANON-KEY';
window.__board0 = fetch(B0U + '/rest/v1/rpc/get_board', {
  method: 'POST',
  headers: { apikey: B0K, Authorization: 'Bearer ' + B0K,
             'Content-Type': 'application/json' },
  body: JSON.stringify({ p_limit: 40 })
}).then(r => r.ok ? r.json() : null)
  // stamp ARRIVAL, not consumption: this reply may sit here for seconds while
  // the rest of the page boots, and skew is what the countdown clock runs on
  .then(b => { window.__board0t = Date.now(); return b; })
  .catch(() => null);
</script>
<link rel="stylesheet" href="style.css">
<!-- No preload for the header cat: it is decorative, it is already in an <img>
     tag further down, and as a 287KB as=image preload it outranked config.js
     and the first get_board. Measured on production it finished 1380ms in,
     while the RPC the screen actually waits for could not even start until
     822ms. Decorative pixels never go in front of the data. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<script src="config.js"></script>
<script>
if (CFG.SUPABASE_URL !== B0U || CFG.SUPABASE_ANON_KEY !== B0K)
  console.error('head prefetch credentials disagree with config.js');
</script>
<style>
  body{overflow:hidden}
  #app{
    /* the FINAL RESULT banner is fixed to the floor, so the board gives up
       exactly its height instead of letting it sit on top of the team strip */
    height:calc(100dvh - var(--bannerpad,0px));
    display:grid;grid-template-rows:auto 1fr;gap:clamp(8px,1.3vh,18px);
    padding:clamp(10px,2vh,24px) clamp(10px,2vw,28px);
    transition:height .5s cubic-bezier(.32,.72,0,1)
  }

  /* ══ header ═══════════════════════════════════════════ */
  header{display:flex;align-items:center;gap:clamp(8px,1.4vw,20px);flex-wrap:wrap}
  .lockup{display:flex;align-items:center;gap:clamp(8px,1vw,14px);min-width:0}
  .hcat{
    width:clamp(38px,5vw,86px);flex:none;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.7)) drop-shadow(0 0 30px rgba(255,122,26,.75));
    animation:bob 5s ease-in-out infinite
  }
  @keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
  .titles{min-width:0}
  h1{
    margin:0;font-size:clamp(20px,3.5vw,54px);line-height:.94;
    background:linear-gradient(100deg,#fff 4%,var(--ember) 38%,var(--pumpkin) 62%,var(--witch));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 26px rgba(255,122,26,.35))
  }
  .subline{
    display:flex;align-items:center;gap:.9em;margin-top:.35em;flex-wrap:wrap;
    font-size:clamp(8px,.78vw,13px)
  }
  .subline .adi{font-size:inherit}
  .subline .sep{width:1px;height:1.4em;background:var(--hair)}
  .subline .live{
    display:inline-flex;align-items:center;gap:.5em;color:var(--dim);
    letter-spacing:.2em;text-transform:uppercase;font-weight:600
  }
  .subline .live i{width:5px;height:5px;border-radius:50%;background:var(--toxic);
    box-shadow:0 0 9px var(--toxic);animation:blip 2.4s ease-in-out infinite}

  #timer{
    font-family:var(--font-display);font-size:clamp(24px,4.2vw,68px);font-variant-numeric:tabular-nums;
    padding:.06em clamp(10px,1.1vw,20px);border-radius:18px;line-height:1.2;
    background:var(--glass);border:1px solid var(--hair);box-shadow:var(--inset)
  }
  #timer.hot{
    color:var(--blood);border-color:rgba(255,46,85,.6);
    box-shadow:0 0 44px -10px rgba(255,46,85,.95), var(--inset);animation:tick 1s infinite
  }
  #timer.idle{
    font-family:var(--font-ui);font-weight:600;
    font-size:clamp(11px,1.3vw,20px);color:var(--dim);letter-spacing:.2em
  }
  @keyframes tick{50%{transform:scale(1.045)}}

  .stats{display:flex;gap:clamp(8px,1.3vw,18px);margin-left:auto;align-items:center}
  .stat{
    text-align:right;line-height:1.05;padding:.5em .9em;border-radius:14px;
    background:var(--glass-2);border:1px solid var(--hair-soft);box-shadow:var(--inset)
  }
  .stat b{
    display:block;font-family:var(--font-display);font-size:clamp(16px,2.1vw,32px);
    font-variant-numeric:tabular-nums
  }
  .stat span{font-size:clamp(7px,.72vw,11px);color:var(--dim);letter-spacing:.2em;text-transform:uppercase;font-weight:600}
  .stat.pops b{color:var(--ember)}

  /* ══ layout: hero race board + department strip ═══════════ */
  main{display:grid;grid-template-rows:1fr auto;gap:clamp(8px,1.4vh,18px);min-height:0}
  .bezel.panel{padding:5px;border-radius:26px;min-height:0;display:grid}
  .bezel.panel > .core{
    padding:clamp(9px,1.3vh,17px);display:grid;grid-template-rows:auto 1fr;
    gap:clamp(6px,1vh,10px);min-height:0;border-radius:21px
  }
  .core h2{
    margin:0;font-family:var(--font-ui);font-weight:700;
    font-size:clamp(9px,.95vw,15px);letter-spacing:.28em;text-transform:uppercase;color:var(--dim);
    display:flex;align-items:center;gap:.7em
  }
  .core h2 em{color:var(--ember);font-style:normal}
  .core h2::after{content:"";flex:1;height:1px;background:var(--hair-soft)}
  .list{position:relative;display:block;min-height:0;overflow:hidden}

  /* ══ THE PASS — a broadcast lower-third, not a toast ══
     This used to be a rounded pill with a border and a drop shadow: web
     notification chrome, on a screen a whole room is watching. It is the same
     information rebuilt as kinetic type over a soft scrim — tracked label,
     hero name, victim — with no edge anywhere for the eye to read as a box.
     It is anchored to the BOTTOM on purpose: fireOvt only fires for the top 5,
     so the lanes people are actually watching stay uncovered while the type
     says who just did it. That is also where a broadcast puts a name. */
  .bezel.panel > .core{position:relative}
  #ovt{position:absolute;left:0;right:0;bottom:0;z-index:45;pointer-events:none;opacity:0;
    display:grid;justify-items:center;gap:clamp(1px,.35vh,5px);
    padding:clamp(22px,5vh,64px) 4% clamp(7px,1.9vh,26px);
    text-align:center}
  /* the authentic lower-third device: a shading gradient the full width of the
     panel, darkest at the floor and gone by the top. A small radial was not
     enough — lane bars read straight through the victim line. This dims the
     bottom lanes instead of erasing them, and still has no edge anywhere. */
  #ovt::before{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(to top,rgba(7,4,12,.96) 0%,rgba(7,4,12,.93) 34%,
      rgba(7,4,12,.72) 62%,rgba(7,4,12,.3) 84%,transparent 100%)}
  /* Anton is unreadable at label size, so the micro-label is the UI face */
  #ovtVerb{font-style:normal;font-family:var(--font-ui);font-weight:700;
    font-size:clamp(10px,.72vw,15px);letter-spacing:.34em;text-indent:.34em;
    color:var(--ember);text-shadow:0 0 18px rgba(255,150,40,.75)}
  /* Anton carries no Thai glyphs, so a Thai name falls through to Noto Sans
     Thai — that fallback is the mechanism, not a bug. line-height stays loose
     and NOTHING on this line clips, or วรรณยุกต์ get sheared off the top. */
  #ovtA{font-family:var(--font-display);
    font-size:clamp(24px,3.3vw,60px);line-height:1.18;letter-spacing:.012em;
    background:linear-gradient(100deg,#fff 0 34%,#fff8e0 43%,var(--ember) 50%,#fff8e0 57%,#fff 66%);
    background-size:300% 100%;background-position:100% 0;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 30px rgba(255,140,30,.6)) drop-shadow(0 5px 16px rgba(0,0,0,.65))}
  #ovtPast{display:flex;align-items:baseline;gap:.5em;white-space:nowrap;
    font-family:var(--font-ui);font-size:clamp(11px,.92vw,19px);color:var(--dim)}
  #ovtPast i{font-style:normal;font-size:.82em;letter-spacing:.14em;color:rgba(160,148,198,.62)}
  #ovtB{font-weight:700;color:rgba(255,255,255,.84);max-width:16ch;overflow:hidden;text-overflow:ellipsis}
  /* taking the lead is the one moment that earns gold */
  #ovt.lead #ovtVerb{color:#ffe7a8;letter-spacing:.38em;text-indent:.38em}
  #ovt.lead #ovtA{
    background:linear-gradient(100deg,#ffe9b0 0 34%,#fff 43%,#ffd257 50%,#fff 57%,#ffe9b0 66%);
    background-size:300% 100%;background-position:100% 0;
    -webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 0 42px rgba(255,200,90,.85)) drop-shadow(0 5px 16px rgba(0,0,0,.65))}

  /* ── the race lanes ──
     --fs is the row unit, set once per layout by JS. EVERY fixed column is sized
     in --fs rather than em, because the podium rows run at 1.22em: em-sized
     gutters made each lane a different width, so one shared comet position was
     impossible and the poles drifted onto the names. */
  #players{font-size:clamp(14px,1.5vw,30px);--fs:16px;--namew:calc(9.6*var(--fs));--tipw:4px}
  /* the track is an EMPTY spacer cell. It exists purely to carve out a zone the
     name and the stats can never enter, and it is the only thing we measure. */
  #players .track{min-width:0;height:100%;pointer-events:none}
  /* lanes are absolutely placed and moved ONLY by transform: rank changes ride the
     compositor, so reordering never triggers layout and never janks. */
  #players .row{
    position:absolute;left:0;right:0;top:0;height:var(--h,56px);
    transform:translate3d(0,var(--y,0px),0);
    transition:transform .58s var(--spring),opacity .4s linear;
    will-change:transform;contain:layout paint style;
    display:grid;
    grid-template-columns:
      calc(2.6*var(--fs))              /* rank medal */
      minmax(0,var(--namew))           /* name + dept */
      minmax(0,1fr)                    /* THE TRACK — nothing else may enter */
      auto                             /* live/s + peak/s */
      calc(1.4*var(--fs))              /* overtake arrow */
      calc(5.4*var(--fs));             /* score */
    align-items:center;gap:clamp(8px,1vw,20px);padding:0 clamp(10px,1.1vw,20px);line-height:1.15;
    overflow:hidden;border-radius:16px;
    background:linear-gradient(90deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
    border:1px solid var(--hair-soft);box-shadow:var(--inset)}
  #players .row > *{position:relative;z-index:1}
  /* bar grows with scaleX (GPU) instead of width (paint); the comet tip is
     counter-scaled so it keeps its true thickness at any fill level */
  /* bar grows with scaleX (GPU) instead of width (paint). It now STARTS at the
     track's left edge (--tl) instead of the row's, so no fill and no comet can
     ever sit under the rank medal or the player's name. */
  #players .row > .barfill{position:absolute;left:var(--tl,0px);top:0;bottom:0;width:var(--tw,100%);z-index:0;border-radius:14px;
    transform:scaleX(var(--p,.03));transform-origin:left center;
    transition:transform var(--glide,.7s) var(--spring);
    background:linear-gradient(90deg,rgba(255,122,26,.42),rgba(255,193,77,.20) 55%,rgba(139,92,246,.08) 92%,transparent)}
  /* comet tip lives OUTSIDE the scaled bar and glides on translate, so its glow
     never smears and it stays razor sharp at any fill level */
  #players .row > .tip{position:absolute;left:var(--tl,0px);top:16%;bottom:16%;width:var(--tipw);border-radius:4px;z-index:0;
    transform:translate3d(var(--tx,0px),0,0);transition:transform var(--glide,.7s) var(--spring);will-change:transform;
    background:linear-gradient(#fff,#ffd23a);box-shadow:0 0 18px 4px rgba(255,193,77,.85),0 0 6px 1px #fff}
  /* opacity, not box-shadow: animating a 28px shadow blur re-rasterises the tip
     every frame on every moving row */
  #players .row.moving > .tip{animation:tippulse .5s ease-in-out infinite}
  @keyframes tippulse{0%,100%{opacity:.72}50%{opacity:1}}
  /* overtake flash — opacity only, driven by the Web Animations API (no reflow hack) */
  #players .row > .flash{position:absolute;inset:0;z-index:0;opacity:0;pointer-events:none;border-radius:inherit}
  #players .row > .flash.up{background:linear-gradient(90deg,rgba(124,255,178,.42),rgba(124,255,178,.06) 60%,transparent);
    box-shadow:inset 0 0 0 2px rgba(124,255,178,.85),0 0 46px -4px rgba(124,255,178,.9)}
  #players .row > .flash.down{background:linear-gradient(90deg,rgba(255,46,85,.38),rgba(255,46,85,.05) 60%,transparent);
    box-shadow:inset 0 0 0 2px rgba(255,46,85,.7),0 0 36px -6px rgba(255,46,85,.75)}
  /* light streak that rips across the lane on an overtake */
  #players .row > .streak{position:absolute;top:-45%;bottom:-45%;left:-25%;right:-25%;z-index:2;opacity:0;
    pointer-events:none;transform:translate3d(-70%,0,0);
    background:linear-gradient(104deg,transparent 43%,rgba(255,255,255,.62) 50%,transparent 57%)}
  #players .row > .streak.down{background:linear-gradient(104deg,transparent 43%,rgba(255,120,150,.45) 50%,transparent 57%)}
  #players .row.p1 > .barfill{
    background:linear-gradient(90deg,rgba(255,193,77,.58),rgba(255,122,26,.30) 60%,transparent);
    box-shadow:inset 0 0 40px rgba(255,193,77,.45)}
  #players .row.p2 > .barfill{background:linear-gradient(90deg,rgba(200,205,225,.34),rgba(255,255,255,.05) 70%,transparent)}
  #players .row.p3 > .barfill{background:linear-gradient(90deg,rgba(205,127,50,.36),rgba(255,255,255,.04) 70%,transparent)}

  /* ── rank medals ──────────────────────────────────────────────────────────
     Metallic discs for the podium, a cool chip for the pack. The shimmer is a
     ROTATING conic gradient (transform only), so the podium looks expensive but
     costs nothing per frame — the disc is rasterised once and spun on the GPU. */
  #players .rk{position:relative;z-index:1;font-family:var(--font-display);text-align:center;
    color:var(--dim);font-variant-numeric:tabular-nums;contain:layout style}
  #players .rk::before{content:"";position:absolute;left:50%;top:50%;width:1.72em;height:1.72em;z-index:-1;
    transform:translate3d(-50%,-50%,0);border-radius:50%;
    background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.16),transparent 62%),rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.10)}
  @keyframes medalspin{to{transform:translate3d(-50%,-50%,0) rotate(360deg)}}

  /* the pack (4th and below) — cool violet chip, clearly a rung below the podium */
  #players .row.pk .rk{color:#d7dcff}
  #players .row.pk .rk::before{
    background:radial-gradient(circle at 34% 28%,rgba(200,208,255,.22),transparent 62%),rgba(120,116,215,.18);
    border-color:rgba(165,175,255,.36)}

  /* podium: dark numerals on bright metal */
  #players .row.p1 .rk,#players .row.p2 .rk,#players .row.p3 .rk{color:#2a1c06;text-shadow:none}
  #players .row.p1 .rk::before{will-change:transform;animation:medalspin 7s linear infinite;
    background:conic-gradient(from 210deg,#7a4b00,#ffd76b 18%,#fff6cf 32%,#ffc83d 48%,#8a5500 68%,#ffe08a 86%,#7a4b00);
    border-color:rgba(255,236,170,.95);box-shadow:0 0 24px -2px rgba(255,190,60,.95)}
  #players .row.p2 .rk::before{will-change:transform;animation:medalspin 9s linear infinite;
    background:conic-gradient(from 210deg,#6d737f,#e9eef8 20%,#ffffff 33%,#c3cbd9 50%,#79808d 70%,#eef2fa 88%,#6d737f);
    border-color:rgba(240,245,255,.95);box-shadow:0 0 20px -3px rgba(214,224,240,.85)}
  #players .row.p3 .rk::before{will-change:transform;animation:medalspin 11s linear infinite;
    background:conic-gradient(from 210deg,#6a3410,#e2954f 20%,#ffd9b0 34%,#cd7f32 50%,#7a3f14 70%,#f0a968 88%,#6a3410);
    border-color:rgba(255,205,155,.9);box-shadow:0 0 20px -3px rgba(214,130,60,.85)}
  #players .who{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.12em;line-height:1.02}
  #players .nm{font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #players .dp{font-size:.46em;color:var(--dim);letter-spacing:.16em;text-transform:uppercase;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* the score lerps every frame, so it must stay a CHEAP layer — its glow lives
     on the lane behind it (static), never on the numerals themselves */
  #players .sc{font-family:var(--font-display);font-variant-numeric:tabular-nums;color:var(--ember);
    text-align:right;contain:layout style}
  #players .row.p1 .sc{color:#ffe9a8}
  #players .row.p2 .sc{color:#eef2fa}
  #players .row.p3 .sc{color:#ffd3a6}
  #players .mv{text-align:center;font-size:.74em;font-weight:900;opacity:0;transition:opacity .35s ease}
  #players .mv.up{opacity:1;color:var(--up);text-shadow:0 0 14px var(--up),0 0 4px var(--up)}
  #players .mv.down{opacity:1;color:var(--down);text-shadow:0 0 14px var(--down),0 0 4px var(--down)}

  /* ── leader spotlight + podium identity ───────────────────────────────────
     Each podium place gets its own metal: tinted lane, a bright left edge, a
     matching comet tip. All static paint — only the sheen band moves. */
  #players .row.p1{font-size:1.22em;border-color:rgba(255,193,77,.62);
    background:linear-gradient(90deg,rgba(255,168,26,.20),rgba(255,255,255,.02));
    box-shadow:var(--inset),0 0 34px -10px rgba(255,180,50,.75)}
  #players .row.p2{border-color:rgba(214,224,240,.5);
    background:linear-gradient(90deg,rgba(205,215,235,.13),rgba(255,255,255,.02));
    box-shadow:var(--inset),0 0 26px -12px rgba(210,220,240,.6)}
  #players .row.p3{border-color:rgba(205,127,50,.5);
    background:linear-gradient(90deg,rgba(205,127,50,.15),rgba(255,255,255,.02));
    box-shadow:var(--inset),0 0 26px -12px rgba(205,127,50,.6)}
  #players .row.p2,#players .row.p3{font-size:1.08em}
  /* bright metal edge down the left of each podium lane */
  #players .row.p1::after,#players .row.p2::after,#players .row.p3::after{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;z-index:2;pointer-events:none;
    border-radius:16px 0 0 16px}
  #players .row.p1::after{background:linear-gradient(#fff6cf,#ffc83d 45%,#8a5500)}
  #players .row.p2::after{background:linear-gradient(#ffffff,#c3cbd9 45%,#79808d)}
  #players .row.p3::after{background:linear-gradient(#ffd9b0,#cd7f32 45%,#7a3f14)}
  /* medal-matched comet tips */
  #players .row.p2 > .tip{background:linear-gradient(#fff,#dfe6f5);
    box-shadow:0 0 18px 4px rgba(214,224,240,.85),0 0 6px 1px #fff}
  #players .row.p3 > .tip{background:linear-gradient(#ffe3c4,#cd7f32);
    box-shadow:0 0 18px 4px rgba(214,130,60,.85),0 0 6px 1px #ffd9b0}
  /* the pack still reads as a race, just cooler and quieter than the podium */
  #players .row.pk{border-color:rgba(150,160,255,.22)}
  #players .row.pk > .barfill{
    background:linear-gradient(90deg,rgba(142,138,255,.52),rgba(139,92,246,.22) 62%,transparent)}
  #players .row.pk > .tip{background:linear-gradient(#fff,#b9c0ff);
    box-shadow:0 0 14px 3px rgba(150,150,255,.7),0 0 5px 1px #fff}

  /* sheen rides the compositor: translating a narrow band beats animating
     background-position, which repaints the whole leader row every frame */
  #players .row.p1::before,#players .row.p2::before,#players .row.p3::before{
    content:"";position:absolute;top:0;bottom:0;left:0;width:42%;z-index:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.14) 50%,transparent 66%);
    transform:translate3d(-110%,0,0);will-change:transform;animation:sheen 3.4s linear infinite}
  #players .row.p2::before{animation-duration:5s;opacity:.7}
  #players .row.p3::before{animation-duration:6.2s;opacity:.55}
  @keyframes sheen{to{transform:translate3d(340%,0,0)}}

  /* ── two figures per racer: live (fire) + peak ── */
  /* Every numeral gets a FIXED slot. The lerp rewrites these many times a second,
     and a content-sized grid track would re-resolve the whole row on each digit
     change — that is what made 5 fast players jank. */
  #players .rates{display:flex;align-items:flex-end;gap:clamp(6px,.7vw,16px);contain:layout style}
  .figure{display:flex;flex-direction:column;align-items:center;line-height:.9;width:calc(3.4*var(--fs));flex:none}
  .figure b{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:1.02em;
    display:block;width:100%;text-align:center;contain:layout style}
  .figure i{font-size:.32em;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-style:normal;font-weight:800;margin-top:.35em}
  .figure.peak b{color:#ffdf6e;text-shadow:0 0 16px rgba(255,193,77,.55)}
  .figure.live b{color:var(--dim);transition:color .2s}

  /* live-cps fire tiers — step every 3: 3 / 6 / 9 / 12 / 15 clicks-per-sec.
     These animate TRANSFORM ONLY. The old tiers animated `filter` and
     `background-position` on gradient-clipped text, which forces a full glyph
     repaint (plus two blur passes) every single frame, on every hot row — the
     main reason a handful of fast players could stall the board.

     DO NOT "fix" this again by swapping the scale for an opacity throb. The
     glyphs also carry a static drop-shadow, and scaling a filtered element
     does make the engine re-rasterise the blur — so it looks like a bug. It
     was rewritten as an opacity pulse and A/B'd old-vs-new, 3 interleaved
     reps at 100 players: cpu 75.6% -> 74.3%, style 233 -> 234ms/s, frame p95
     50.1 -> 66.6ms, long frames 13 -> 16. That is no better than nothing (the
     measured noise floor on this box is ~1% cpu), and p95 was worse. The board
     spends ~75% of its time in engine style/paint no matter what these few
     small numbers do. Real theory, no measurable effect — so the approved look
     stays. */
  @keyframes firepulse{50%{transform:scale(1.14)}}
  .figure.live b{will-change:transform}
  .figure.live.t1 b{color:#ffcf6e;text-shadow:0 0 10px rgba(255,180,80,.75)}
  .figure.live.t2 b{color:#ff9a2e;text-shadow:0 0 16px rgba(255,140,40,.9)}
  .figure.live.t3 b,.figure.live.t4 b,.figure.live.t5 b{
    background:linear-gradient(92deg,#ff2a00,#ff8a00 38%,#ffd23a 62%,#ff6a00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,80,0,.85))}
  .figure.live.t4 b{filter:drop-shadow(0 0 14px rgba(255,60,0,.95));
    animation:firepulse 1s ease-in-out infinite}
  .figure.live.t5 b{filter:drop-shadow(0 0 17px rgba(255,70,0,1));
    animation:firepulse .55s ease-in-out infinite}
  .stat.rate b{color:var(--toxic)}

  /* ══ Fastest-now panel (board header) ══ */
  .boardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:.35em}
  .heads{display:flex;align-items:center;gap:clamp(6px,.7vw,12px)}
  .fastest.rec b{color:#ffd36b}
  .fastest.rec.idle b{color:var(--dim)}
  .fastest{display:flex;align-items:baseline;gap:.55em;padding:.32em .85em;border-radius:15px;
    background:var(--glass-2);border:1px solid var(--hair-soft);box-shadow:var(--inset);
    transition:border-color .3s,box-shadow .3s}
  .fastest .flabel{font-size:clamp(8px,.72vw,12px);letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);font-weight:800}
  .fastest b{font-family:var(--font-display);font-size:clamp(17px,1.8vw,32px);
    font-variant-numeric:tabular-nums;line-height:1;color:var(--ember)}
  .fastest b i{font-style:normal;font-size:.5em;opacity:.55;margin-left:1px}
  .fastest #fname{font-weight:800;font-size:clamp(11px,1.05vw,17px);color:#fff;
    max-width:26vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fastest.idle{opacity:.55}
  .fastest.t1 b{color:#ffcf6e}
  .fastest.t2 b{color:#ff9a2e}
  .fastest.t3 b,.fastest.t4 b,.fastest.t5 b{
    background:linear-gradient(92deg,#ff2a00,#ff8a00 38%,#ffd23a 62%,#ff6a00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 9px rgba(255,80,0,.8))}
  .fastest.t3,.fastest.t4,.fastest.t5{border-color:rgba(255,90,0,.5);
    box-shadow:0 0 26px -6px rgba(255,90,0,.65),var(--inset)}
  .fastest.t5 b{will-change:transform;animation:firepulse .6s ease-in-out infinite}

  /* ══ department strip (bottom) — team live/s + top scorer + total ══ */
  #depts{position:relative;height:clamp(60px,10vh,110px);min-height:0}
  .dept{position:absolute;left:0;top:0;bottom:0;width:var(--w,16%);
    transform:translate3d(var(--x,0px),0,0);
    transition:transform .6s var(--spring),width .6s var(--spring),opacity .4s linear;
    will-change:transform;contain:layout paint;
    min-width:0;overflow:hidden;border-radius:15px;
    background:var(--glass-2);border:1px solid var(--hair-soft);box-shadow:var(--inset);
    display:flex;flex-direction:column;justify-content:center;gap:.2em;padding:.4em clamp(8px,.8vw,15px)}
  .dept .barfill{position:absolute;left:0;top:0;bottom:0;width:100%;z-index:0;
    transform:scaleX(var(--p,0));transform-origin:left center;
    background:linear-gradient(90deg,rgba(255,122,26,.30),rgba(139,92,246,.08) 80%,transparent);
    transition:transform var(--glide,.8s) var(--spring)}
  .dept .dhead{position:relative;z-index:1;display:flex;align-items:baseline;justify-content:space-between;gap:.5em;min-width:0}
  .dept .dn{font-weight:800;font-size:clamp(10px,1vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .dept .drate{flex:none;font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:800;
    font-size:clamp(11px,1.15vw,21px);line-height:1;color:var(--dim)}
  .dept .drate i{font-style:normal;font-size:.55em;opacity:.55;margin-left:1px}
  .dept .drate.t1{color:#ffcf6e;text-shadow:0 0 8px rgba(255,180,80,.7)}
  .dept .drate.t2{color:#ff9a2e;text-shadow:0 0 12px rgba(255,140,40,.9)}
  .dept .drate.t3,.dept .drate.t4,.dept .drate.t5{
    background:linear-gradient(92deg,#ff2a00,#ff8a00 38%,#ffd23a 62%,#ff6a00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 8px rgba(255,80,0,.8))}
  .dept .drate.t5{will-change:transform;animation:firepulse .6s ease-in-out infinite}
  .dept .dsub{position:relative;z-index:1;display:flex;align-items:baseline;justify-content:space-between;gap:.5em;min-width:0}
  .dept .dtop{font-size:clamp(8px,.8vw,13px);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .dept .dtop b{color:#ffdf9e;font-weight:800}
  .dept .dt{flex:none;font-family:var(--font-display);font-variant-numeric:tabular-nums;
    color:var(--ember);font-size:clamp(12px,1.25vw,23px);line-height:1}
  .dept.d1{border-color:rgba(255,193,77,.55)}
  .dept.d1 .dt{text-shadow:0 0 20px rgba(255,193,77,.7)}

  /* ══ bottom strip: teams + the fastest-hands panel ══ */
  .bottom{display:grid;grid-template-columns:minmax(0,1fr) clamp(190px,19vw,320px);
    gap:clamp(8px,1vw,14px);align-items:stretch;min-width:0}
  .speedwrap{position:relative;min-width:0;height:clamp(60px,10vh,110px);
    display:flex;flex-direction:column;gap:.3em;overflow:hidden;
    border-radius:15px;padding:.42em clamp(8px,.8vw,14px);
    background:linear-gradient(120deg,rgba(255,122,26,.13),rgba(139,92,246,.07));
    border:1px solid rgba(255,193,77,.30);box-shadow:var(--inset),0 0 30px -14px rgba(255,150,40,.85)}
  .speedwrap h3{margin:0;display:flex;align-items:baseline;gap:.6em;min-width:0;
    font-family:var(--font-ui);font-weight:800;font-size:clamp(7px,.68vw,11px);
    letter-spacing:.2em;text-transform:uppercase;color:#ffd9a0}
  .speedwrap h3 span{font-size:.88em;letter-spacing:.12em;color:var(--dim);font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #speed{flex:1;min-height:0;display:grid;grid-auto-rows:1fr;gap:3px}
  .srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;
    gap:.5em;min-width:0;padding:0 .35em;border-radius:8px;
    transition:background .35s ease,opacity .35s ease}
  .srow .sk{font-size:clamp(10px,.9vw,15px);width:1.75em;flex:none;
    text-align:center;color:var(--dim);line-height:1}
  .srow .sn{font-weight:800;font-size:clamp(9px,.9vw,15px);min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .sv{flex:none;font-family:var(--font-display);font-variant-numeric:tabular-nums;
    font-size:clamp(11px,1.1vw,20px);line-height:1;color:var(--ember)}
  .srow .sv i{font-style:normal;font-size:.55em;opacity:.55;margin-left:1px}
  .srow.s1{background:linear-gradient(90deg,rgba(255,193,77,.20),transparent)}
  .srow.s1 .sk{color:#ffe9a8}
  .srow.s1 .sv{color:#ffdf6e;text-shadow:0 0 14px rgba(255,193,77,.6)}
  .srow.s2 .sv{color:#eef2fa}
  .srow.s3 .sv{color:#ffd3a6}
  .srow.empty{opacity:.32}

  /* final banner */
  #banner{
    position:fixed;inset:auto 0 0;z-index:60;text-align:center;padding:.85em;
    font-family:var(--font-display);letter-spacing:.4em;
    background:linear-gradient(90deg,var(--witch-deep),var(--pumpkin),var(--witch-deep));
    color:#fff;font-size:clamp(11px,1.3vw,20px);
    box-shadow:0 -14px 40px -14px rgba(255,122,26,.8)
  }

  @media (max-width:1100px){
    #players{--namew:calc(8*var(--fs))}
  }
  /* ── phones & tablets: TWO-LINE LANES ────────────────────────────────────
     One line could not hold a race. At 390px the track was 96px — 28% of the
     lane — so ten racers sat ~9px apart and the gap you are trying to close was
     invisible. It was worse just above that: between 561 and 820px --fs grows
     with row height, and the fixed columns squeezed the track down to 74px.
     So below 820px the lane now STACKS — identity on line 1, a near-full-width
     track on line 2 (96px -> ~275px on a phone, ~480px on a tablet). The width
     that frees up on line 1 pays for the department and the ▲▼, which had to be
     hidden before. The board is also the screen a player checks in their hand,
     so it still has to survive 375px. */
  @media (max-width:820px){
    #app{padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
    header{gap:8px}
    .hcat{display:none}
    #timer{order:3}
    .stats{margin-left:auto;gap:6px}
    .stats .stat{padding:.34em .6em;border-radius:11px}
    #players .figure.peak{display:none}
    #depts{display:none}
    .boardhead{flex-wrap:wrap;gap:8px}
    .heads{flex:1 1 100%;gap:8px}
    .heads .fastest{flex:1 1 0;min-width:0;justify-content:center}
    .fastest #fname,.fastest #rname{max-width:none;flex:0 1 auto}
    /* the panel was sized from vh, which on a 667px phone left 7px per entry for
       11px text — it clipped. Size it from its CONTENT instead, and cap it at
       two entries (the #1 peak is already on the 🏆 chip above). */
    .speedwrap{grid-column:1/-1;height:auto;padding:5px 8px;gap:2px}
    #speed{flex:none;gap:3px;grid-auto-rows:15px}
    #speed > :nth-child(n+3){display:none}
    .srow{padding:0 .3em}
    #players .row{
      --r2:calc(.26*var(--h));      /* the race line */
      --rgap:3px;
      gap:var(--rgap) 7px;padding:3px 9px 5px;border-radius:13px;
      grid-template-columns:
        calc(2.3*var(--fs))          /* rank medal — spans BOTH lines */
        minmax(0,1fr)                /* name + dept */
        calc(1.2*var(--fs))          /* overtake arrow */
        auto                         /* live/s */
        calc(4.2*var(--fs));         /* score */
      grid-template-rows:minmax(0,1fr) var(--r2);
      grid-template-areas:
        "rk who mv rates sc"
        "rk track track track track"}
    #players .rk{grid-area:rk}
    #players .who{grid-area:who}
    #players .mv{grid-area:mv}
    #players .rates{grid-area:rates}
    #players .sc{grid-area:sc}
    #players .track{grid-area:track}
    #players .dp{font-size:.5em;letter-spacing:.12em}
    #players .figure{width:calc(3*var(--fs))}
    /* the bar and the comet are absolutely positioned inside the ROW, not inside
       the track cell, so they have to be pinned to the second line by hand —
       otherwise they would stretch the full height and run behind the name. */
    #players .row > .barfill{top:auto;bottom:5px;height:var(--r2);border-radius:8px}
    #players .row > .tip{top:auto;bottom:5px;height:var(--r2)}
  }
  /* ── phones only: buy back vertical space for more lanes ── */
  @media (max-width:560px){
    h1{font-size:clamp(15px,5.2vw,22px)}
    .subline{font-size:9px}
    .subline .sep,.subline .live{display:none}   /* keep the ADI mark, drop the tagline */
    #timer{font-size:clamp(17px,6vw,26px)}
    .stats .stat:nth-child(2){display:none}
    #app{gap:6px}
    .boardhead{margin-bottom:.25em}
    .flabel .lx{display:none}
    .fastest{padding:.3em .6em;gap:.4em}
    .fastest .flabel{white-space:nowrap}
  }

  /* ══ 3-2-1 countdown overlay ══ */
  /* the two sound switches, small enough to stay out of the board's way */
  .sndbar{display:flex;gap:6px;align-items:center}
  .sndbtn{
    display:flex;align-items:center;gap:.45em;cursor:pointer;
    padding:.42em .72em;border-radius:10px;
    border:1px solid var(--hair);background:var(--glass-2);color:var(--dim);
    font-family:var(--font-ui);font-weight:700;font-size:clamp(9px,.72vw,12px);
    letter-spacing:.14em;text-transform:uppercase;line-height:1;
    transition:color .2s var(--spring),border-color .2s var(--spring),background .2s var(--spring)
  }
  .sndbtn span{opacity:.85}
  .sndbtn.on{color:var(--ember);border-color:rgba(255,193,77,.45);
    background:linear-gradient(180deg,rgba(255,193,77,.16),rgba(255,193,77,.05));
    box-shadow:0 0 18px -6px rgba(255,193,77,.7)}
  .sndbtn.off{opacity:.55}
  /* a track cannot legally start before a gesture, so say so instead of
     looking broken when the host clicks and hears nothing */
  .sndbtn.needtap{animation:needtap 1.4s ease-in-out infinite}
  @keyframes needtap{50%{border-color:var(--pumpkin);color:var(--pumpkin)}}

  /* ══ THE COUNTDOWN ══════════════════════════════════════════════════════
     The one moment the whole room looks up — so it is also the one state that
     must not stutter. It used to earn a real full-screen blur on the theory
     that nothing is moving behind it; measurement disagreed (see #cdveil). */
  #cdveil{
    position:fixed;inset:0;z-index:78;pointer-events:none;opacity:0;
    /* Dark enough to bury the scoreboard WITHOUT a live blur -- see below. */
    background:
      radial-gradient(58% 58% at 50% 46%,rgba(76,29,149,.50),transparent 72%),
      radial-gradient(120% 120% at 50% 50%,rgba(4,2,10,.88) 18%,rgba(3,1,8,.985) 78%);
    /* Opacity transitions ON THE WAY OUT ONLY.
       The fade-IN is gone because `#cd.show` sets opacity directly, so the
       digit appears the instant the class lands while every transitioned
       element waits for a frame. Measured on the production projector path:
       the digit hit full opacity at 1940ms and the veil was STILL 0 at 2248ms
       — 660ms of a giant number sitting on a bright, unburied scoreboard
       before its own backdrop caught up. The backdrop is not decoration, it is
       what makes the number legible, so it must never be late. It snaps on
       with the digit and fades out gracefully. */
    transition:opacity .5s var(--spring)
  }
  /* ── WHY THERE IS NO backdrop-filter HERE ANY MORE ─────────────────────
     This used to be blur(18px) saturate(.72) brightness(.55) across the whole
     1920x1080 frame. Paired A/B in one page (cdopenpair.mjs, 5 rounds,
     round-robin with the order reversed on alternate rounds, real GPU):

       base (live blur)            31.2ms/frame   32fps
       same veil, no backdrop      21.6ms         46fps   1.44x
       darker veil, no backdrop    20.2ms         50fps   1.54x

     An earlier session established that blur RADIUS is free; what is not free
     is a full-screen backdrop readback on a surface that recomposites every
     frame. Stacking the other suspects on top only bought 19.5 / 18.6ms
     (bloom, glyph glow) and 17.3ms only by deleting the rings, fog and cats —
     i.e. the countdown itself. So this is the one change worth making.

     Nothing is lost visually: the blur existed to stop the scoreboard behind
     competing with the digit, and the board is frozen behind it anyway. A
     wash at .985 does that job outright, and it does it on the FIRST frame
     instead of after a filter ramp. */
  #cdveil.show{opacity:1;transition:none}
  /* Dropping the veil outright on GO! put toxic green on a bright board — the
     loudest moment of the event was the least legible one. It steps back
     instead of leaving, so the lanes bleed through while GO! still pops. */
  #cdveil.go{opacity:.62}

  /* ── WHY THE COUNTDOWN USED TO DROP FRAMES ─────────────────────────────
     Measured, paired A/B inside one page (cdpair.mjs): the racing board ran
     ~35fps and the countdown ran ~27fps -- the single moment the whole room is
     watching was the worst-performing state on the board.

     The obvious suspect was the full-screen blur, and it was WRONG. Halving
     the blur radius to 10px was worth 0%. What actually cost:
       - the giant digit's two chained drop-shadows   +10%
       - the two cats' two chained drop-shadows        +6%
       - the board still animating behind the veil    +22% (with the above)
     A drop-shadow is a blur pass over the element's whole region. #cd is a
     ~500px glyph and the outer shadow is a 90px blur, so its filter region is
     enormous -- and cdpop/cdflick animate that element every frame, so the
     whole region is re-rasterised every frame.

     The fix is the same one already learned on the lobby rim: SEPARATE THE
     THING THAT MOVES FROM THE THING THAT IS EXPENSIVE. The big soft bloom is
     now a static pre-painted gradient that never animates, and the moving
     glyph keeps only its tight inner glow. */
  body.cd-on #app, body.cd-on #app *{animation-play-state:paused!important}

  /* the bloom that used to be #cd's outer 90px drop-shadow. Fixed-position so
     it is out of #cdstage's grid flow -- as a grid item it would create a
     track and shove the digit off the rings' centre, which is exactly how
     #cdsub broke this layout once before. */
  #cdstage::before{
    content:'';position:fixed;left:50%;top:50%;
    width:min(86vh,74vw);height:min(86vh,74vw);
    transform:translate3d(-50%,-50%,0);border-radius:50%;
    background:radial-gradient(circle,rgba(255,46,85,.42),rgba(255,46,85,.16) 42%,transparent 68%);
    opacity:0;transition:opacity .45s var(--spring);pointer-events:none;z-index:-1
  }
  body.cd-on #cdstage::before{opacity:1}
  body.cd-go #cdstage::before{
    background:radial-gradient(circle,rgba(157,255,77,.40),rgba(157,255,77,.15) 42%,transparent 68%)}

  /* drifting graveyard fog — two slabs, transform-only, no filters */
  #cdfog{position:fixed;inset:0;z-index:78;pointer-events:none;opacity:0;
    transition:opacity .6s var(--spring);overflow:hidden}
  #cdfog.show{opacity:1}
  #cdfog i{
    position:absolute;left:-40%;width:180%;height:46%;display:block;
    background:radial-gradient(50% 60% at 50% 50%,rgba(139,92,246,.20),transparent 68%),
               radial-gradient(38% 52% at 22% 46%,rgba(255,122,26,.12),transparent 70%);
    will-change:transform
  }
  #cdfog i:nth-child(1){top:6%;animation:fogA 19s linear infinite}
  #cdfog i:nth-child(2){bottom:2%;animation:fogB 25s linear infinite}
  @keyframes fogA{from{transform:translate3d(-12%,0,0)}to{transform:translate3d(12%,0,0)}}
  @keyframes fogB{from{transform:translate3d(10%,0,0)}to{transform:translate3d(-10%,0,0)}}

  /* a summoning ring that winds up under the number */
  #cdring{
    position:fixed;left:50%;top:50%;width:min(80vh,70vw);height:min(80vh,70vw);
    margin:calc(min(80vh,70vw) / -2) 0 0 calc(min(80vh,70vw) / -2);
    z-index:79;pointer-events:none;border-radius:50%;opacity:0;
    background:conic-gradient(from 0deg,transparent 0deg,rgba(255,122,26,.0) 190deg,
      rgba(255,122,26,.6) 312deg,rgba(255,46,85,.95) 350deg,transparent 360deg);
    -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 68%,transparent 69%);
    mask:radial-gradient(circle,transparent 62%,#000 63%,#000 68%,transparent 69%);
    transition:opacity .45s var(--spring);will-change:transform
  }
  #cdring.show{opacity:1;animation:cdspin 1s linear infinite}
  #cdring.go{animation:cdburst .75s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes cdspin{to{transform:rotate(360deg)}}
  @keyframes cdburst{
    0%{transform:scale(1);opacity:1;filter:hue-rotate(0deg)}
    100%{transform:scale(1.9);opacity:0;filter:hue-rotate(-90deg)}
  }
  /* ONE number drives the inner ring AND where the label sits. They used to be
     sized independently, so at 390px the ring grew past the label and the two
     collided — the same trap as the lane gutters: if two things must clear each
     other, they have to derive from the same value, not from two guesses. */
  :root{--cdring2:min(58vh,50vw)}
  /* a second, slower counter-ring so the centre reads as a portal, not a clock */
  #cdring2{
    position:fixed;left:50%;top:50%;width:var(--cdring2);height:var(--cdring2);
    margin:calc(var(--cdring2) / -2) 0 0 calc(var(--cdring2) / -2);
    z-index:79;pointer-events:none;border-radius:50%;opacity:0;
    border:2px dashed rgba(157,255,77,.30);
    transition:opacity .45s var(--spring);will-change:transform
  }
  #cdring2.show{opacity:1;animation:cdspin2 7s linear infinite}
  #cdring2.go{opacity:0}
  @keyframes cdspin2{to{transform:rotate(-360deg)}}

  /* the stage centres cat + number + cat as one group, so the digit can never
     drift off-centre when the cats change size */
  #cdstage{
    position:fixed;inset:0;z-index:80;pointer-events:none;
    /* place-CONTENT, not place-items. place-items centres each item inside its
       own track; with auto rows the TRACKS still stack from the top, which
       parked the whole countdown in the upper third of the projector. */
    display:grid;place-content:center;justify-items:center;
    grid-auto-rows:min-content;gap:clamp(4px,1vh,16px)
  }
  #cdrow{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.6vw,34px)}
  .cdcat{
    width:min(21vh,17vw);flex:none;opacity:0;
    /* ONE drop-shadow, not two. These bob continuously (catL/catR, 1.6s
       infinite), so every chained shadow is another full blur pass re-run on
       every frame of that animation -- measured at 6% of the countdown's frame
       budget for the dark contact shadow alone, which is invisible anyway
       against a backdrop already darkened to brightness(.55). */
    filter:drop-shadow(0 0 26px rgba(255,122,26,.85));
    transition:opacity .4s var(--spring);will-change:transform
  }
  .cdcat.show{opacity:1}
  .cdcat.l{animation:catL 1.6s ease-in-out infinite}
  .cdcat.r{transform:scaleX(-1);animation:catR 1.6s ease-in-out infinite}
  @keyframes catL{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-11px) rotate(3deg)}}
  @keyframes catR{0%,100%{transform:scaleX(-1) translateY(0) rotate(-7deg)}
                  50%{transform:scaleX(-1) translateY(-11px) rotate(3deg)}}
  /* on a phone the cats would squeeze the digit — the digit always wins */
  @media (max-width:820px){ .cdcat{display:none} }

  #cd{
    font-family:var(--font-display);font-size:min(48vh,40vw);line-height:.86;
    letter-spacing:-.02em;opacity:0;
    /* gradient-filled digits read far better on a projector than flat white.
       NOTE: with background-clip:text the glow MUST be filter:drop-shadow —
       text-shadow paints behind transparent glyphs and simply vanishes. */
    background:linear-gradient(177deg,#fff 2%,var(--ember) 34%,var(--pumpkin) 68%,var(--blood) 99%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    /* Only the TIGHT glow stays on the animated glyph. The wide soft bloom that
       used to be a second drop-shadow(0 0 90px) is now #cdstage::before, a
       static gradient that never re-rasterises. Same look, one blur pass
       instead of two over a ~500px glyph, every frame. */
    filter:drop-shadow(0 0 30px rgba(255,122,26,.95));
    will-change:transform
  }
  #cd.show{opacity:1;animation:cdpop .5s cubic-bezier(.2,.9,.2,1),cdflick 2.1s steps(1) infinite .5s}
  #cd.go{
    font-size:min(32vh,29vw);
    background:linear-gradient(177deg,#eaffd0 2%,var(--toxic) 42%,#3fbf28 99%);
    -webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 0 40px rgba(157,255,77,.95));
    animation:cdpop .5s cubic-bezier(.2,.9,.2,1)
  }
  /* The pop animates TRANSFORM ONLY, and it starts at a size that is already
     readable. Twice now a late first frame has frozen this element on its 0%
     keyframe — once at opacity .15 (an invisible ghost) and once at scale .42
     (a digit a quarter of its proper size on a 1920 projector). The rule both
     times: the 0% keyframe is not a starting position, it is the worst thing
     the audience might see, so it must still look right. */
  @keyframes cdpop{0%{transform:scale(.78) rotate(-5deg)}
    45%{transform:scale(1.07) rotate(1.5deg)}
    100%{transform:scale(1) rotate(0)}}
  /* a dying-fluorescent stutter — cheap, and it reads as haunted not broken */
  @keyframes cdflick{0%,96%,100%{opacity:1}97%{opacity:.4}98%{opacity:1}99%{opacity:.6}}

  /* GET READY, sitting under the number so the eye lands on the digit first.
     Deliberately NOT a grid child: adding it to the centred stage made the grid
     taller and pushed the digit off the rings' centre. Pinning it to the ring
     radius keeps the digit exactly concentric at every size.
     The font is bound by BOTH axes — sized on vh alone, 22 wide-tracked letters
     ran edge-to-edge on a 390px phone with nowrap and no way to escape. */
  #cdsub{
    position:fixed;left:0;right:0;z-index:80;
    top:calc(50% + var(--cdring2) * .5 + clamp(10px,1.7vh,26px));
    text-align:center;pointer-events:none;opacity:0;white-space:nowrap;
    font-family:var(--font-ui);font-weight:700;
    font-size:clamp(9px,min(1.55vh,2.3vw),22px);
    letter-spacing:clamp(.16em,.62vw,.62em);text-transform:uppercase;color:#ffc79a;
    text-shadow:0 0 24px rgba(255,122,26,.9);transition:opacity .4s var(--spring)
  }
  #cdsub.show{opacity:.95}
  @media (prefers-reduced-motion:reduce){
    #cdring.show,#cdring2.show,#cd.show,.cdcat.l,.cdcat.r,#cdfog i{animation:none}
  }
</style>
</head>
