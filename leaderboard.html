<!-- config.js already loaded in <head> so the board request could start there -->
<script src="sb.js"></script>
<script>
const $ = s => document.querySelector(s);
const box = $('#players'), dbox = $('#depts');
let endsAt = null, startsAt = null, prevScore = new Map(), wasLive = false, lastTotal = 0, seenStarts = null;
let cps = new Map(), peak = new Map(), deptStats = new Map(), cpsTs = 0, prevMax = 1, cdVal = null, cdCounting = false;
let cdPlan = null;      // {n, slice} — the beat schedule, fixed when the countdown is first seen
let rawEnds = null;     // server round end, WITHOUT the EVENT_END fallback endsAt carries

/* ── sound ──────────────────────────────────────────────────────────────
   This screen owns the room's speakers, so the backing track defaults ON here
   (phones default OFF — a hundred copies a second out of sync is just noise).
   Autoplay still needs a gesture, so the button flags itself until it gets one
   rather than sitting there looking switched on with silence coming out. */
Snd.init({ musicDefault: true, volume: 0.4 });
const bMusic = $('#btnmusic'), bSfx = $('#btnsfx');
function paintSnd() {
  bMusic.className = 'sndbtn ' + (Snd.music ? 'on' : 'off')
    + (Snd.music && !Snd._armed ? ' needtap' : '');
  bMusic.firstChild.nodeValue = Snd.music ? '🎵' : '🎶';
  bSfx.className = 'sndbtn ' + (Snd.sfx ? 'on' : 'off');
  bSfx.firstChild.nodeValue = Snd.sfx ? '🔊' : '🔇';
}
bMusic.onclick = () => { Snd.setMusic(!Snd.music); paintSnd(); };
bSfx.onclick = () => { Snd.setSfx(!Snd.sfx); paintSnd(); };
// the first click anywhere is what unblocks playback; repaint so the hint clears
addEventListener('pointerdown', () => setTimeout(paintSnd, 60), { passive: true });
paintSnd();

/* ══════════════════════════════════════════════════════════════════════════
   SMOOTH ENGINE
   Rows and chips are created ONCE and never destroyed while their player is on
   screen. Everything that moves is driven by transform/opacity only (compositor
   thread), so reordering and bar growth cannot jank even while JS is busy.
   Only the numerals are JS-driven, through a single shared rAF loop.
   ══════════════════════════════════════════════════════════════════════════ */
const rowMap = new Map(), deptMap = new Map(), gNums = [];
/* MAXROWS is the hard cap the room ever sees; MINROW is what a lane needs to
   stay readable. */
const MINROW = 46, MAXROWS = 15, GAP = 8, DGAP = 10;
let lastRowH = -1, lastW = -1, prevByRank = new Map(), bestOvt = null;
let lastBoxW = -1, lastBoxH = -1, roBusy = false;
let leadEl = null, trackW = 0, trackL = -1, fitRaf = 0, fitSettle = 0;
const TIPW = 4;

// One place that owns every size derived from a lane's height. --fs must respect
// WIDTH as well: on a phone a tall row would otherwise pick a font so large that
// the fixed columns eat the entire race track and the comet has nowhere to run.
function applyRowMetrics(rowH) {
  box.style.setProperty('--h', rowH.toFixed(1) + 'px');
  const w = box.clientWidth || 600;
  const units = innerWidth <= 560 ? 24 : innerWidth <= 820 ? 22 : 30;
  const fs = Math.max(10, Math.min(30, Math.min(rowH * .40, w / units)));
  box.style.setProperty('--fs', fs.toFixed(1) + 'px');
  box.style.fontSize = fs.toFixed(1) + 'px';
}

const fInt  = v => num(Math.round(v));
const fRate = v => v >= 10 ? String(Math.round(v)) : v >= 0.05 ? v.toFixed(1) : '0';

function mkNum(el, fmt, eps, snap) {
  return { el, fmt, eps: eps || .5, cur: 0, tgt: 0, on: false, last: null, snap: !!snap };
}
function putNum(o) { const s = o.fmt(o.cur); if (s !== o.last) { o.last = s; o.el.textContent = s; } }
// Snapped numerals never animate their text. Rewriting text inside a glowing /
// gradient-clipped element re-rasterises that layer, and doing it every frame on
// every hot row was measurably the board's single biggest stall (36 long tasks
// -> 0 when disabled). Glow lives on static layers; changing text stays cheap.
function setNum(o, v) {
  o.tgt = v;
  if (o.snap) { if (o.cur !== v || !o.on) { o.on = true; o.cur = v; putNum(o); } return; }
  if (!o.on) { o.on = true; o.cur = v; putNum(o); }
}
/* Under load the board used to snap into place in .7s and then sit perfectly
   still for the rest of a multi-second gap. That stillness IS what reads as lag —
   the data was arriving, nothing was moving. Stretching the glide to match the
   gap we are actually achieving keeps the bars and numerals travelling the whole
   time, and because they only ever move between two REAL polled values there is
   no prediction here that could be wrong. */
let numK = .16;
function setGlide(gapMs) {
  const g = Math.max(600, Math.min(2600, gapMs));
  document.documentElement.style.setProperty('--glide', (g / 1000).toFixed(2) + 's');
  // numerals step ~31x/s, so this is the per-step factor that lands them on the
  // new value just about when the next poll replaces it
  numK = Math.max(.03, Math.min(.22, 3 / (31.25 * g / 1000)));
}

function stepNums(list) {
  for (const o of list) {
    if (!o.on || o.snap) continue;
    const d = o.tgt - o.cur;
    if (Math.abs(d) < o.eps) { if (o.cur !== o.tgt) { o.cur = o.tgt; putNum(o); } continue; }
    o.cur += d * numK;
    putNum(o);
  }
}
let numT = 0;
(function frame(ts) {
  /* Nothing behind the countdown veil is legible (18px blur at brightness .55)
     and nobody can score during the lead-in, so stepping numerals there is pure
     waste -- and worse than waste: every text write dirties the veil's backdrop
     and forces a FULL-SCREEN blur to be recomputed for that frame. Measured,
     pausing only the CSS animations behind the veil bought +3%; this loop was
     what kept the backdrop dirty anyway. Numbers are snapped on the way in
     (see cdOn) so nothing is mid-glide while we are not stepping. */
  if (!cdCounting && ts - numT >= 32) {
    // numerals are read by humans, not machines: ~30fps looks identical but halves
    // the text writes (and the style work each one costs) on a board full of spammers
    numT = ts;
    stepNums(gNums);
    for (const r of rowMap.values()) stepNums(r.nums);
    for (const d of deptMap.values()) stepNums(d.nums);
  }
  requestAnimationFrame(frame);
})(0);

// land every numeral on its target immediately, so suspending the stepper can
// never leave a half-counted score frozen on screen
function snapAllNums() {
  const snap = list => { for (const o of list) if (o.on && o.cur !== o.tgt) { o.cur = o.tgt; putNum(o); } };
  snap(gNums);
  for (const r of rowMap.values()) snap(r.nums);
  for (const d of deptMap.values()) snap(d.nums);
}

addEventListener('resize', () => {
  lastRowH = -1; lastW = -1; lastBoxW = -1; lastBoxH = -1; trackW = 0; trackL = -1;
  settleLayout(320);
});
// A resize event is not the end of the story: the panel height transitions for
// .5s afterwards and a rotation lands in stages, so a fixed settle window can
// measure the track mid-flight and then never correct itself. Watch the box
// itself instead of guessing.
new ResizeObserver(() => {
  if (roBusy) return;                 // relayout only writes --y/--fs, but never trust that
  roBusy = true;
  lastRowH = -1;
  relayout();
  roBusy = false;
}).observe(box);

$('#evtname').textContent = CFG.EVENT_NAME;
mountNav('#navhost', 'board');

const fvalEl = $('#fval');
fvalEl.innerHTML = '<span></span><i>/s</i>';
const nFast = mkNum(fvalEl.firstChild, fRate, .04, true);
const rvalEl = $('#rval');
rvalEl.innerHTML = '<span></span><i>/s</i>';
const nRec = mkNum(rvalEl.firstChild, fRate, .04, true);
const nRate = mkNum($('#tr'), fInt, .5, true);
const nPlayers = mkNum($('#tp'), fInt, .5);
const nClicks = mkNum($('#tc'), fInt, 2);
gNums.push(nFast, nRec, nRate, nPlayers, nClicks);

// the record holder is sticky for the whole race: it survives the holder
// sliding out of the visible top-N, and only clears when the peaks clear
let recBest = { name: '', val: 0 };
// peak/s per player, sticky for the whole race: someone can post the fastest
// hands of the day and still slide out of the visible top-N, and the panel
// must keep showing them.
const peakWho = new Map();
function clearRates() {
  cps.clear(); peak.clear(); peakWho.clear();
  prevScore = new Map(); prevByRank = new Map();
  recBest = { name: '', val: 0 };
  try { localStorage.removeItem(PKEY); } catch { }
  peakDue = 0;                       // let the cleared state be written immediately
}

/* ── peaks survive a refresh ──────────────────────────────────────────────
   The projector gets reloaded mid-event (screensaver, cable, someone hits F5)
   and every peak used to come back as 0. A peak is the one number a player
   cannot re-earn on demand, so peaks are mirrored into localStorage and put
   back on boot. Live rates are deliberately NOT stored: they have to start at
   zero and be re-measured, or the board would open showing fake motion. */
const PKEY = 'popcat.peaks';
let peakDue = 0;
function savePeaks(force) {
  const now = Date.now();
  if (!force && now < peakDue) return;
  peakDue = now + 2000;              // localStorage writes are synchronous: keep them rare
  try {
    localStorage.setItem(PKEY, JSON.stringify({
      v: 1, starts: seenStarts, total: lastTotal,
      peak: [...peak].map(([id, v]) => [id, Math.round(v * 100) / 100]),
      who: [...peakWho].map(([id, w]) => [id, w.name, Math.round(w.val * 100) / 100]),
      rec: [recBest.name, recBest.val]
    }));
  } catch { /* private mode or quota: peaks just won't survive, never fatal */ }
}
function loadPeaks() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch { }
  if (!d || d.v !== 1) return;
  for (const [id, v] of d.peak || []) peak.set(id, Number(v) || 0);
  for (const [id, name, v] of d.who || []) peakWho.set(id, { name, val: Number(v) || 0 });
  recBest = { name: (d.rec || [])[0] || '', val: Number((d.rec || [])[1]) || 0 };
  // carry the reset detectors across too, so the very first poll can still spot a
  // score reset or a wipe that happened while this page was closed
  seenStarts = d.starts || null;
  lastTotal = Number(d.total) || 0;
}

// ── fastest-hands panel ──
const speedBox = $('#speed'), speedRows = [];
function renderSpeed() {
  const list = [...peakWho.values()].sort((a, b) => b.val - a.val).slice(0, 3);
  for (let i = 0; i < 3; i++) {
    let s = speedRows[i];
    if (!s) {
      const el = document.createElement('div');
      el.innerHTML = '<span class="sk"></span><span class="sn"></span><span class="sv"><span></span><i>/s</i></span>';
      speedBox.append(el);
      s = speedRows[i] = { el, sk: el.querySelector('.sk'), sn: el.querySelector('.sn'),
                           num: mkNum(el.querySelector('.sv span'), fRate, .04, true), cls: '', nms: '' };
      gNums.push(s.num);
    }
    const d = list[i];
    const cls = 'srow ' + (d ? 's' + (i + 1) : 'empty');
    if (s.cls !== cls) { s.cls = cls; s.el.className = cls; }
    const k = d ? ['🥇', '🥈', '🥉'][i] : '·';
    if (s.sk.textContent !== k) s.sk.textContent = k;
    const nm = d ? d.name : 'waiting…';
    if (s.nms !== nm) { s.nms = nm; s.sn.textContent = nm; }
    setNum(s.num, d ? d.val : 0);
  }
}

const tier = r => r >= 15 ? 5 : r >= 12 ? 4 : r >= 9 ? 3 : r >= 6 ? 2 : r >= 3 ? 1 : 0;

// every lane is the same height, so one formula is exact — no measure/converge loop
function layout(n) {
  const H = box.clientHeight || 420;
  // phones and tablets run TWO-LINE lanes (identity above, race track below),
  // so a lane needs more height there or the track row collapses and the race
  // vanishes. This must track the 820px breakpoint in the stylesheet.
  const minRow = innerWidth <= 820 ? 52 : MINROW;
  const maxFit = Math.max(3, Math.floor((H + GAP) / (minRow + GAP)));
  const count = Math.max(1, Math.min(n, maxFit, MAXROWS));
  const rowH = (H - GAP * (count - 1)) / count;
  return { count, rowH, pitch: rowH + GAP };
}

// Geometry-only refit. Safe to run every frame while the container is resizing,
// unlike a full render() — that would feed near-zero dt into the rate EMA and
// spike everyone's clicks/sec. Rows are placed from the rank they already hold.
function relayout() {
  if (!rowMap.size) return;
  const geo = layout(rowMap.size);
  const bw = box.clientWidth, bh = box.clientHeight;
  // The track is MEASURED, so anything that moves it has to invalidate it — not
  // just a change in row height. A pure width change (rotating the phone, resizing
  // the window, crossing a breakpoint) used to leave --tl/--tw describing the OLD
  // layout, and because measureTrack() only re-ran when rowH changed, the stale
  // value stuck: comets parked hundreds of px past the end of their lane.
  if (geo.rowH !== lastRowH || bw !== lastBoxW || bh !== lastBoxH) {
    lastRowH = geo.rowH; lastBoxW = bw; lastBoxH = bh;
    applyRowMetrics(geo.rowH);
    scheduleFit();               // --fs drives the columns, so the track moved
  }
  for (const row of rowMap.values()) {
    const i = (row.rank || 1) - 1;
    const y = i * geo.pitch;
    if (row.y !== y) { row.y = y; row.el.style.setProperty('--y', y.toFixed(1) + 'px'); }
    const op = i >= geo.count ? '0' : '1';   // no half-cut lane at the floor
    if (row.el.style.opacity !== op) row.el.style.opacity = op;
  }
}

// the container animates its height, so refit on every frame of that transition
// instead of waiting for the next poll to notice
function settleLayout(ms) {
  const t0 = performance.now();
  const step = () => {
    relayout();
    if (performance.now() - t0 < ms) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// Fires whenever a lane's race zone actually changes width — rotation, a
// breakpoint, the panel's height transition, browser zoom. measureTrack() is a
// no-op when nothing moved, so this is cheap.
const trackRO = new ResizeObserver(() => scheduleFit());

function makeRow(r) {
  const el = document.createElement('div');
  el.className = 'row';
  el.dataset.id = r.id;
  el.innerHTML =
    '<div class="barfill"></div><div class="tip"></div><div class="flash"></div><div class="streak"></div>' +
    '<div class="rk"></div>' +
    '<div class="who"><div class="nm"></div><div class="dp"></div></div>' +
    '<div class="track"></div>' +
    '<div class="rates">' +
      '<div class="figure live"><b></b><i>live/s</i></div>' +
      '<div class="figure peak"><b></b><i>peak/s</i></div>' +
    '</div>' +
    '<div class="mv"></div><div class="sc"></div>';
  const q = s => el.querySelector(s);
  const row = {
    el, flash: q('.flash'), streak: q('.streak'), rk: q('.rk'), nm: q('.nm'), dp: q('.dp'),
    live: q('.figure.live'), mv: q('.mv'), sc: q('.sc'), track: q('.track'),
    cls: '', rcls: '', lt: -1, rank: null, rks: '', nms: '', dps: '', p: -1, y: -1, mvT: 0
  };
  row.nums = [mkNum(row.sc, fInt, .5), mkNum(q('.figure.live b'), fRate, .04, true), mkNum(q('.figure.peak b'), fRate, .04, true)];
  // The comet's position is a pixel offset derived from the track's width, so the
  // ONLY safe trigger to recompute it is the track itself changing size. Polling
  // for that (on resize, on rowH change, once per board poll) is a race: a
  // breakpoint change lands over several frames, and a measurement taken mid-flight
  // becomes the value we keep. Watching the cell removes the timing question.
  trackRO.observe(row.track);
  return row;
}

const EASE = 'cubic-bezier(.32,.72,0,1)';

// the whole overtake moment — every keyframe is transform/opacity, so it rides
// the compositor and stays glass-smooth even mid-storm
function playOvertake(row, up) {
  row.mv.textContent = up ? '▲' : '▼';
  row.mv.className = 'mv ' + (up ? 'up' : 'down');

  row.flash.className = 'flash ' + (up ? 'up' : 'down');
  row.flash.animate([{ opacity: 0 }, { opacity: 1, offset: .12 }, { opacity: .8, offset: .34 }, { opacity: 0 }],
                    { duration: up ? 900 : 780, easing: EASE });

  row.streak.className = 'streak' + (up ? '' : ' down');
  row.streak.animate([{ opacity: 0, transform: 'translate3d(-72%,0,0)' },
                      { opacity: 1, offset: .24 },
                      { opacity: 0, transform: 'translate3d(72%,0,0)' }],
                     { duration: up ? 660 : 880, easing: 'cubic-bezier(.22,.85,.3,1)' });

  row.rk.animate([{ transform: 'scale(1)' },
                  { transform: `scale(${up ? 1.6 : .74}) translateY(${up ? -3 : 3}px)`, offset: .22 },
                  { transform: 'scale(1)' }],
                 { duration: 720, easing: EASE });

  row.mv.animate([{ transform: 'translateY(0)', opacity: 0 },
                  { transform: `translateY(${up ? -8 : 8}px)`, opacity: 1, offset: .3 },
                  { transform: 'translateY(0)', opacity: 1 }],
                 { duration: 720, easing: EASE });

  if (up) row.sc.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.22)', offset: .24 }, { transform: 'scale(1)' }],
                         { duration: 620, easing: EASE });
}

/* -Infinity, not 0: performance.now() IS under 1900 for the first two seconds
   of a page's life, so a zero start made the "one callout at a time" gate
   swallow any overtake that happened right after the projector was opened. */
let ovtAt = -Infinity, ovtAnims = [];
function fireOvt(o) {
  if (!o.victim || o.victim === o.who) return;
  const now = performance.now();
  if (now - ovtAt < 1900) return;                 // one callout at a time — never spammy
  ovtAt = now;
  const el = $('#ovt'), lead = o.rank === 1;
  $('#ovtA').textContent = o.who;
  $('#ovtB').textContent = o.victim;
  $('#ovtVerb').textContent = lead ? '👑 TAKES THE LEAD' : '▲ OVERTAKE';
  el.className = lead ? 'lead' : '';

  for (const a of ovtAnims) a.cancel();
  ovtAnims = [];
  const push = (node, frames, opts) => ovtAnims.push(node.animate(frames, opts));
  // easing in the OPTIONS is applied to overall progress BEFORE keyframe offsets
  // are looked up, and EASE is front-loaded enough that half the duration is
  // already 97% of the way through. That silently crushed this whole sequence
  // into its first ~600ms. Overall timing stays linear so the offsets below mean
  // what they say, and every curve lives on the segment it belongs to.
  const D = 2000, LIN = { duration: D, easing: 'linear' };

  // the lockup arrives as one object…
  push(el, [
    // no scale on the container: it now spans the panel, so scaling it would
    // drag the shading gradient's edges into view
    { opacity: 0, transform: 'translate3d(0,22px,0)', easing: EASE },
    { opacity: 1, transform: 'none', offset: .15 },
    { opacity: 1, transform: 'none', offset: .72, easing: 'ease-in' },
    { opacity: 0, transform: 'translate3d(0,-12px,0)' }
  ], LIN);

  // …then the three lines settle in sequence. That stagger is the whole
  // difference between a lower-third and a box that simply appears.
  push($('#ovtVerb'), [
    { transform: 'translate3d(0,9px,0)', easing: EASE },
    { transform: 'none', offset: .19 }, { transform: 'none' }
  ], LIN);
  push($('#ovtA'), [
    { transform: 'translate3d(0,16px,0) scale(.93)' },
    { transform: 'translate3d(0,16px,0) scale(.93)', offset: .03, easing: EASE },
    { transform: 'translate3d(0,0,0) scale(1.02)', offset: .22, easing: 'ease-out' },
    { transform: 'none', offset: .34 }, { transform: 'none' }
  ], LIN);
  push($('#ovtPast'), [
    { opacity: 0, transform: 'translate3d(0,8px,0)' },
    { opacity: 0, transform: 'translate3d(0,8px,0)', offset: .11, easing: EASE },
    { opacity: 1, transform: 'none', offset: .40 }, { opacity: 1, transform: 'none' }
  ], LIN);

  // one light sweep rips across the glyphs. background-position repaints the
  // name, which is why it is ONE element for 2s and not a per-row effect.
  push($('#ovtA'), [
    { backgroundPosition: '100% 0' },
    { backgroundPosition: '100% 0', offset: .075, easing: 'cubic-bezier(.3,.82,.25,1)' },
    { backgroundPosition: '0% 0', offset: .47 }, { backgroundPosition: '0% 0' }
  ], LIN);
}

function updateRow(row, r, i, geo, max, W) {
  const el = row.el, st = el.style;

  const y = i * geo.pitch;
  if (row.y !== y) { row.y = y; st.setProperty('--y', y.toFixed(1) + 'px'); }

  const rate = cps.get(r.id) || 0, t = tier(rate);
  const cls = 'row' + (r.rank <= 3 ? ' p' + r.rank : ' pk') + (t ? ' moving' : '');
  if (row.cls !== cls) { row.cls = cls; el.className = cls; }
  if (row.lt !== t) { row.lt = t; row.live.className = 'figure live' + (t ? ' t' + t : ''); }

  const rk = String(r.rank);
  if (row.rks !== rk) { row.rks = rk; row.rk.textContent = rk; }
  const nm = (r.rank === 1 ? '👑 ' : '') + r.username;
  if (row.nms !== nm) { row.nms = nm; row.nm.textContent = nm; }
  if (row.dps !== r.department) { row.dps = r.department; row.dp.textContent = r.department; }

  // overtake: arrow + a pure-opacity flash via the Web Animations API (no reflow hack)
  if (row.rank != null && row.rank !== r.rank) {
    const up = r.rank < row.rank;
    playOvertake(row, up);
    clearTimeout(row.mvT);
    row.mvT = setTimeout(() => { row.mv.className = 'mv'; }, 2800);
    if (up && r.rank <= 5 && (!bestOvt || r.rank < bestOvt.rank))
      bestOvt = { rank: r.rank, who: r.username, victim: prevByRank.get(r.rank) || '' };
  }
  row.rank = r.rank;

  const p = Math.max(.02, Number(r.score) / max);
  row.pRaw = p;
  setBar(row, p, W);

  setNum(row.nums[0], Number(r.score));
  setNum(row.nums[1], rate);
  setNum(row.nums[2], peak.get(r.id) || 0);
}

// The comet travels the TRACK only, and stops exactly one tip-width short of the
// far end, so it can never clip out of the lane or touch the stats. The bar is
// then scaled to land on the comet's own right edge — one source of truth for
// both, instead of two formulas that could drift apart.
function setBar(row, p, W) {
  // The cache has to key on the TRACK WIDTH as well as the fill fraction. Keying
  // on p alone meant that when the track changed size but a player's share of the
  // lead did not, this returned early and the comet kept a pixel offset measured
  // against a track that no longer existed — parking it hundreds of px past the
  // end of its lane after a rotation or a breakpoint change.
  if (!(p >= 0) || (Math.abs(row.p - p) <= .0005 && row.w === W)) return;
  row.p = p; row.w = W;
  const st = row.el.style;
  const tx = p * Math.max(0, W - TIPW);
  st.setProperty('--tx', tx.toFixed(1) + 'px');
  st.setProperty('--p', (W > 0 ? (tx + TIPW) / W : .03).toFixed(4));
}

// Reads the race zone off the real grid cell. Returns true when the geometry
// actually changed, so callers can invalidate the lanes that depend on it.
function measureTrack() {
  const src = (leadEl && leadEl.isConnected ? leadEl : rowMap.values().next().value?.el);
  const tr = src && src.querySelector('.track');
  if (!tr) return false;
  const tl = tr.offsetLeft, tw = tr.clientWidth;
  if (tw <= 0 || (Math.abs(tl - trackL) <= 1 && Math.abs(tw - trackW) <= 1)) return false;
  trackL = tl; trackW = tw;
  box.style.setProperty('--tl', tl.toFixed(0) + 'px');
  box.style.setProperty('--tw', tw.toFixed(0) + 'px');
  for (const row of rowMap.values()) row.p = -1;
  return true;
}

function scheduleFit(retry) {
  if (fitRaf) cancelAnimationFrame(fitRaf);
  fitRaf = requestAnimationFrame(() => {
    fitRaf = 0;
    // Crossing a breakpoint can leave the track cell momentarily 0-wide. Measuring
    // then is worse than not measuring at all, so come back next frame instead of
    // freezing every lane against the old geometry.
    const src = (leadEl && leadEl.isConnected ? leadEl : rowMap.values().next().value?.el);
    const tr = src && src.querySelector('.track');
    if (tr && tr.clientWidth <= 0 && (retry || 0) < 20) { scheduleFit((retry || 0) + 1); return; }
    applyFit();
    // A single frame is not enough. A resize settles in stages — the breakpoint
    // swaps the grid, then applyRowMetrics rewrites --fs, and each stage moves the
    // track again. Measuring once caught an intermediate width (a 159px track read
    // as 206px) and froze every comet against it, which is exactly the "comet 51px
    // past the end" seen after a rotation. measureTrack() is a no-op when nothing
    // moved, so these follow-ups cost nothing once the layout is stable.
    clearTimeout(fitSettle);
    let n = 0;
    (function again() {
      applyFit();
      if (++n < 4) fitSettle = setTimeout(again, n * 140);
    })();
  });
}

// One place that turns "the race zone moved" into "every comet is repositioned".
function applyFit() {
  if (measureTrack()) for (const row of rowMap.values()) setBar(row, row.pRaw, trackW);
}

function render(top) {
  bestOvt = null;
  // live clicks/sec per player: EMA over score delta since last poll
  const now = performance.now();
  const dt = cpsTs ? (now - cpsTs) / 1000 : 0;
  cpsTs = now;
  if (dt > 0.05) for (const r of top) {
    const prev = prevScore.get(r.id);
    if (prev === undefined) continue;
    const inst = Math.max(0, (Number(r.score) - prev) / dt);
    const cur = cps.get(r.id) || 0;
    const v = cur + (inst - cur) * 0.5;
    cps.set(r.id, v);
    peak.set(r.id, Math.max(peak.get(r.id) || 0, v));   // best clicks/sec this race
  }
  setNum(nRate, [...cps.values()].reduce((a, b) => a + b, 0));

  // per-team live rate + crowned top scorer, and the single fastest racer right now
  deptStats = new Map();
  let fastName = '', fastRate = 0;
  for (const r of top) {
    const rate = cps.get(r.id) || 0;
    if (rate > fastRate) { fastRate = rate; fastName = r.username; }
    const pk = peak.get(r.id) || 0;
    if (pk > recBest.val) recBest = { name: r.username, val: pk };
    if (pk > 0) {
      const w = peakWho.get(r.id);
      if (!w) peakWho.set(r.id, { name: r.username, val: pk });
      else { w.name = r.username; if (pk > w.val) w.val = pk; }
    }
    let s = deptStats.get(r.department);
    if (!s) { s = { cps: 0, name: '', score: -1 }; deptStats.set(r.department, s); }
    s.cps += rate;
    if (Number(r.score) > s.score) { s.score = Number(r.score); s.name = r.username; }
  }
  setFastest(fastName, fastRate);
  setRecord(recBest.name, recBest.val);
  renderSpeed();

  // ── one measure per frame, before any write: zero forced reflow ──
  const geo = layout(top.length), W = box.clientWidth;
  // The track is a real grid cell now, so its edges ARE the race zone — read
  // them instead of guessing a gutter. Every lane shares one geometry because
  // every non-track column is sized in --fs, not em.
  measureTrack();
  if (geo.rowH !== lastRowH) { lastRowH = geo.rowH; applyRowMetrics(geo.rowH); }
  if (W !== lastW) { lastW = W; for (const row of rowMap.values()) row.p = -1; }

  const shown = top.slice(0, geo.count);
  const max = Math.max(1, ...shown.map(r => Number(r.score)));
  const keep = new Set();

  for (let i = 0; i < shown.length; i++) {
    const r = shown[i];
    keep.add(r.id);
    let row = rowMap.get(r.id);
    if (!row) {
      row = makeRow(r);
      rowMap.set(r.id, row);
      row.y = i * geo.pitch;
      row.el.style.setProperty('--y', row.y.toFixed(1) + 'px');
      row.el.style.opacity = '0';
      box.append(row.el);
      requestAnimationFrame(() => { row.el.style.opacity = '1'; });
    }
    if (i === 0) leadEl = row.el;
    updateRow(row, r, i, geo, max, trackW);
  }
  for (const [id, row] of rowMap) if (!keep.has(id)) {
    rowMap.delete(id);
    clearTimeout(row.mvT);
    trackRO.unobserve(row.track);        // the observer holds a strong ref
    row.el.style.opacity = '0';
    setTimeout(() => row.el.remove(), 440);
  }

  prevScore = new Map(top.map(r => [r.id, Number(r.score)]));
  prevByRank = new Map(top.map(r => [r.rank, r.username]));
  prevMax = max;
  if (bestOvt) fireOvt(bestOvt);

  // Rows created this pass only exist in the DOM from the NEXT frame, so the
  // very first measure is necessarily stale. Re-measure once the browser has
  // laid them out and push the lanes again — otherwise every bar sits at zero
  // fill until the following poll.
  scheduleFit();
}

let fastCls = '';
function setFastest(name, rate) {
  const ok = rate >= 1 && !!name;
  setNum(nFast, ok ? rate : 0);
  const n = $('#fname'), nm = ok ? name : 'waiting…';
  if (n.textContent !== nm) n.textContent = nm;
  const cls = ok ? 'fastest t' + Math.max(1, tier(rate)) : 'fastest idle';
  if (fastCls !== cls) { fastCls = cls; $('#fastest').className = cls; }
}

let recCls = '';
function setRecord(name, rate) {
  const ok = rate >= 1 && !!name;
  setNum(nRec, ok ? rate : 0);
  const n = $('#rname'), nm = ok ? name : '—';
  if (n.textContent !== nm) n.textContent = nm;
  const cls = ok ? 'fastest rec t' + Math.max(1, tier(rate)) : 'fastest rec idle';
  if (recCls !== cls) { recCls = cls; $('#record').className = cls; }
}

function makeDept() {
  const el = document.createElement('div');
  el.className = 'dept';
  el.innerHTML =
    '<div class="barfill"></div>' +
    '<div class="dhead"><div class="dn"></div><div class="drate"><span></span><i>/s</i></div></div>' +
    '<div class="dsub"><div class="dtop"></div><div class="dt"></div></div>';
  const q = s => el.querySelector(s);
  const d = { el, dn: q('.dn'), drate: q('.drate'), dtop: q('.dtop'),
              cls: '', rcls: '', dns: '', tops: '', x: -1, w: -1, p: -1 };
  d.nums = [mkNum(q('.drate span'), fRate, .04, true), mkNum(q('.dt'), fInt, 2)];
  return d;
}

function renderDepts(depts) {
  const list = depts.slice(0, 6);
  if (!list.length) return;
  const max = Math.max(1, ...list.map(d => Number(d.total)));
  const W = dbox.clientWidth;
  const w = (W - DGAP * (list.length - 1)) / list.length;
  const keep = new Set();

  list.forEach((d, i) => {
    keep.add(d.department);
    let c = deptMap.get(d.department);
    if (!c) {
      c = makeDept(); deptMap.set(d.department, c);
      c.x = i * (w + DGAP); c.w = w;
      c.el.style.setProperty('--x', c.x.toFixed(1) + 'px');
      c.el.style.width = w.toFixed(1) + 'px';
      c.el.style.opacity = '0';
      dbox.append(c.el);
      requestAnimationFrame(() => { c.el.style.opacity = '1'; });
    }
    const x = i * (w + DGAP);
    if (c.x !== x) { c.x = x; c.el.style.setProperty('--x', x.toFixed(1) + 'px'); }
    if (c.w !== w) { c.w = w; c.el.style.width = w.toFixed(1) + 'px'; }

    const p = Number(d.total) / max;
    if (Math.abs(c.p - p) > .0005) { c.p = p; c.el.style.setProperty('--p', p.toFixed(4)); }

    const cls = 'dept' + (i === 0 ? ' d1' : '');
    if (c.cls !== cls) { c.cls = cls; c.el.className = cls; }
    const dn = (i === 0 ? '🏆 ' : '') + d.department;
    if (c.dns !== dn) { c.dns = dn; c.dn.textContent = dn; }

    const st = deptStats.get(d.department) || { cps: 0, name: '', score: 0 };
    const t = tier(st.cps), rcls = 'drate' + (t ? ' t' + t : '');
    if (c.rcls !== rcls) { c.rcls = rcls; c.drate.className = rcls; }
    const topTxt = st.name ? '👑 ' + st.name + ' · ' + num(st.score) : d.members + ' players';
    if (c.tops !== topTxt) { c.tops = topTxt; c.dtop.textContent = topTxt; c.dtop.style.opacity = st.name ? '' : '.5'; }

    setNum(c.nums[0], st.cps);
    setNum(c.nums[1], Number(d.total));
  });

  for (const [k, c] of deptMap) if (!keep.has(k)) {
    deptMap.delete(k);
    c.el.style.opacity = '0';
    setTimeout(() => c.el.remove(), 440);
  }
}

async function poll() {
  try {
    const b = (await firstBoard()) || (await rpc('get_board', { p_limit: 40 }));
    const tc = Number(b.total_clicks) || 0;
    // a new race, OR an admin "reset scores" / player wipe (the board total
    // can only fall when someone cleared it) both retire the old peaks
    if ((b.starts_at && b.starts_at !== seenStarts) || tc < lastTotal - 2) clearRates();
    lastTotal = tc; seenStarts = b.starts_at || null;
    rawEnds = b.ends_at || null;
    endsAt = b.ends_at || CFG.EVENT_END || null; startsAt = b.starts_at;
    setNum(nPlayers, Number(b.total_players) || 0);
    setNum(nClicks, tc);
    render(b.top || []);
    renderDepts(b.depts || []);
    savePeaks();
  } catch { /* keep the last board on screen */ }
}

// Countdown before a race. Returns true while it's showing.
// Everything is toggled with classes only — no per-frame JS — so the main
// thread stays free for the lanes. Element lookups are cached once: cdEls()
// used to run six querySelectors on every 200ms tick for no reason.
let _cdc = null;
function cdEls() {
  if (!_cdc) _cdc = {
    cd: $('#cd'), veil: $('#cdveil'), ring: $('#cdring'), ring2: $('#cdring2'),
    sub: $('#cdsub'), fog: $('#cdfog'), cats: [...document.querySelectorAll('.cdcat')]
  };
  return _cdc;
}

function showCd(text, go) {
  const { cd, ring, ring2, sub } = cdEls();
  cd.classList.remove('show'); void cd.offsetWidth;   // re-trigger the pop each change
  cd.textContent = text; cd.classList.toggle('go', !!go); cd.classList.add('show');
  ring.classList.toggle('go', !!go);
  ring2.classList.toggle('go', !!go);
  sub.classList.toggle('show', !go);
  // the static bloom behind the digit has to change colour with it, and CSS
  // cannot select a parent from #cd.go, so the state lives on <body>
  document.body.classList.toggle('cd-go', !!go);
}

function cdOn() {
  const { veil, ring, ring2, fog, cats } = cdEls();
  /* Tell the page the veil is up. Everything behind it then stops animating:
     it is blurred past legibility and unscoreable, so the only thing those
     animations still achieve is dirtying the backdrop and forcing a
     full-screen blur recompute every frame. */
  document.body.classList.add('cd-on');
  snapAllNums();                 // never freeze the stepper mid-count
  veil.classList.add('show'); veil.classList.remove('go');
  ring.classList.add('show'); ring.classList.remove('go');
  ring2.classList.add('show'); ring2.classList.remove('go');
  fog.classList.add('show');
  cats.forEach(c => c.classList.add('show'));
}

/* NOT pre-rasterised on purpose. The first cdOn() looked like a ~1.8s paint
   bill, and a one-shot warm-up that painted these layers at opacity .004 was
   built to pay it early — it changed nothing, because the stall was never
   paint. It was `new AudioContext()` inside the first Snd.beat() (see sb.js).
   Style and layout for every step of cdOn() total 26ms; measured without any
   warm-up the beats come out 9-12ms apart. Left here so nobody rebuilds it. */
function cdOff() {
  const { cd, veil, ring, ring2, sub, fog, cats } = cdEls();
  cd.classList.remove('show', 'go');
  document.body.classList.remove('cd-on', 'cd-go');
  // the blur lives on .show, so dropping it here is what stops the projector
  // paying for a full-screen backdrop readback for the rest of the race
  veil.classList.remove('show', 'go');
  ring.classList.remove('show', 'go');
  ring2.classList.remove('show', 'go');
  sub.classList.remove('show');
  fog.classList.remove('show');
  cats.forEach(c => c.classList.remove('show'));
  cdCounting = false; cdVal = null; clearBeats();
  snapAllNums();                 // resume showing the truth immediately
}

/* The beats are SCHEDULED, not recomputed per tick.
   tick() runs at 200ms, so deriving the digit from the clock each time quantised
   every beat to the next tick: an 886ms beat was painted as 1132ms, then 669ms,
   then 1002ms (measured). The digits were right and the total was right, but the
   rhythm stumbled -- which is exactly what "the 5 is a rush" describes.
   One timer per beat costs nothing and lands each digit on its real boundary. */
function clearBeats() {
  if (cdPlan) for (const t of cdPlan.timers) clearTimeout(t);
  cdPlan = null;
}

function showGo() {
  cdVal = 'GO';
  showCd('GO!', true);
  $('#cdveil').classList.add('go');
  Snd.go(); Snd.duck(900);
}

function scheduleBeats(left) {
  clearBeats();
  /* EVEN BEATS, not real seconds.
     The server puts the start 5s out, but this screen only learns about it when
     a poll lands -- typically with ~4.4s left. Counting real seconds then gave
     one short opening beat followed by full ones. So divide the time we ACTUALLY
     have into equal slices: 4.4s becomes five 880ms beats. The digits are no
     longer seconds, deliberately -- it was never a stopwatch -- but every beat
     is the same length, and GO! still fires on the true server start so scoring
     is untouched.

     SELF-CORRECTING: each beat schedules only the next one, from a monotonic
     deadline. A pre-scheduled list of timers cannot survive a hiccup -- one
     936ms stall on the opening frame left the whole run a beat behind and GO!
     then guillotined "1" after 54ms, which is uglier than the bug this
     replaced. Re-deriving the step from the time genuinely left keeps the
     digits consecutive, keeps them even with each other, and lands GO! on the
     start line no matter what the first frame costs. */
  const n = Math.max(1, Math.min(5, Math.round(left / 1000)));
  cdPlan = { n, slice: left / n, timers: [] };
  const end = performance.now() + left;

  const beat = (k) => {
    if (!cdCounting) return;
    const remain = end - performance.now();
    if (k < 1 || remain <= 120) { if (cdVal !== 'GO') showGo(); return; }
    const d = String(k);
    cdVal = d; showCd(d, false); Snd.beat(d); Snd.duck(1400);
    // never below 240ms: a digit nobody can read is worse than a dropped beat
    const step = Math.max(240, (end - performance.now()) / k);
    cdPlan.timers.push(setTimeout(() => beat(k - 1), Math.round(step)));
  };
  beat(n);
}

function countdown() {
  if (!startsAt) { if (cdCounting || cdVal) cdOff(); return false; }
  // msLeft() clamps at 0, so it can never tell "just started" from "started ten
  // minutes ago" — using it here pinned a full-screen GO! over the board for the
  // whole race. This offset is signed: negative before the start, growing after.
  const sinceStart = serverNow() - Date.parse(startsAt);
  if (sinceStart < 0) {
    if (!cdCounting) { cdCounting = true; cdOn(); scheduleBeats(-sinceStart); }
    return true;
  }
  if (cdCounting) {
    if (sinceStart < 1100) {
      if (cdVal !== 'GO') showGo();
      return true;
    }
    cdOff();
  }
  return false;
}

function tick() {
  const counting = countdown();
  const left = msLeft(endsAt), t = $('#timer');
  if (counting) { t.className = 'idle'; t.textContent = 'GET READY'; hideBanner(); return; }
  const live = !endsAt || left > 0;
  if (live) {
    t.className = left <= 10000 && endsAt ? 'hot' : '';
    t.textContent = endsAt ? clock(left) : 'OPEN';
    wasLive = !!endsAt;                 // open play never shows a FINAL RESULT banner
  } else {
    t.className = 'idle';
    t.textContent = 'FINISHED';
  }
  setBanner(!live && wasLive);
}

// the banner is fixed to the floor, so showing it must also shrink #app by its
// height — otherwise it parks on top of the team strip
function setBanner(show) {
  const b = $('#banner');
  if (b.hidden !== !show) {
    b.hidden = !show;
    if (show) b.textContent = 'FINAL RESULT';
    document.documentElement.style.setProperty(
      '--bannerpad', show ? (b.offsetHeight + 8) + 'px' : '0px');
    lastRowH = -1; lastW = -1; lastBoxW = -1; lastBoxH = -1; trackW = 0; trackL = -1;
    settleLayout(700);            // outlast the .5s height transition
  }
}
const hideBanner = () => setBanner(false);

tick();
setInterval(tick, 200);
// ponytail: same lesson as the phones — never stack requests. One board read at a
// time, pace follows real server latency so the projector eases off when the DB is hot.
let lbLat = 250, lbGap = 900;
loadPeaks();
(async function loopBoard() {
  // the glide must already be in place before poll() writes the new bar targets,
  // otherwise the duration change only takes effect one refresh late
  setGlide(lbGap);
  const t0 = performance.now();
  await poll();
  const took = performance.now() - t0;
  lbLat += (took - lbLat) * 0.3;
  let target = lbLat < 250 ? 700 : lbLat < 600 ? 1000 : lbLat < 1500 ? 1600 : 2400;

  /* Spend requests where they buy something.
     During the lead-in nobody can score, so the board literally cannot change
     and a 700ms poll is 700ms of nothing — while the main thread is busy with
     the one animation the whole room is watching. Polling still happens, just
     slowly, so a host who stops the round mid-countdown is still noticed.
     A hidden tab is the same argument taken further: nobody is looking. */
  if (cdCounting) target = Math.max(target, 2500);
  else if (document.hidden) target = Math.max(target, 5000);
  /* Waiting for a round to be started from someone's phone is the one moment
     latency is visible as a MISTAKE rather than staleness: the lead-in is only
     5s, so a 700ms poll can mean the board first hears about it with 4.2s left
     and the count opens on 4 instead of 5. This is one projector, not a hundred
     handsets — 2.5 requests/sec here is nothing against a measured 185/s
     ceiling, and it buys the full five beats. */
  else if (!rawEnds || serverNow() >= Date.parse(rawEnds)) target = Math.min(target, 400);

  /* The wait now ABSORBS the request instead of being added on top of it. The old
     line waited the full delay AFTER the reply landed, so a 2s reply became a
     2s + 3s = 5s gap between refreshes — five seconds of a frozen leaderboard
     while every phone was still clicking. Same ceiling on request rate, none of
     the dead time. */
  const d = Math.max(250, target - took);
  lbGap += (took + d - lbGap) * 0.4;
  setTimeout(loopBoard, d);
})();

/* Coming back to a hidden-then-visible tab must not wait out a 5s backoff —
   the host flipping to the projector wants the live board immediately. */
addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
</script>
</body>
