<!doctype html>
<meta charset="utf-8">
<title>control</title>
<style>
  html,body{margin:0;height:100%;background:#07070c;color:#fff;font:14px system-ui}
  /* One cheap moving element: a page with NOTHING animating can be optimised
     down to zero frames, which would measure the harness's idle rate rather
     than its ceiling. This keeps the compositor honestly busy and nothing else. */
  .d{position:absolute;top:50%;left:0;width:120px;height:120px;border-radius:50%;
     background:#3de0ff;animation:go 3s linear infinite}
  @keyframes go{to{transform:translateX(1800px)}}
</style>
<div class="d"></div>
<p style="position:absolute;bottom:12px;left:12px">control — one composited circle, no blur, no gradients</p>
